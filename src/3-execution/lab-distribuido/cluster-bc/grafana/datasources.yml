apiVersion: 1

datasources:
  - name: InfluxDB-JMeter
    uid: influxdb-jmeter
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: jmeter
      httpMode: GET
    isDefault: true

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Prometheus está fuera de este clúster, en PC A (NodePort 30090)
    url: http://192.168.10.1:30090
