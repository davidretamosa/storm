# Disco persistente de Prometheus en PC A: sobrevive a reinicios de pods y de Docker.
# Se borra solo con ./quitar.sh (al borrar el namespace).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-datos
  namespace: lab-jmeter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
