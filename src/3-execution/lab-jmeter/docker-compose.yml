services:
  app:
    build: ./app
    image: lab-app
    container_name: app
    ports:
      - "8080:8080"
    networks:
      - lab-net

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=jmeter
    volumes:
      - influx-data:/var/lib/influxdb
    networks:
      - lab-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cadvisor
    networks:
      - lab-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - lab-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
      - prometheus
    networks:
      - lab-net

  jmeter:
    build: ./jmeter
    image: lab-jmeter
    container_name: jmeter
    depends_on:
      - app
    volumes:
      - ./jmeter:/test
      - ./resultados:/resultados
    command: ["-n", "-t", "/test/plan.jmx", "-l", "/resultados/resultados.jtl", "-f"]
    networks:
      - lab-net
    profiles: ["test"]

networks:
  lab-net:
    name: lab-compose-net

volumes:
  influx-data:
  grafana-data:
