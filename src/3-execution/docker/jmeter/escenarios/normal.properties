# CARGA NORMAL: el tráfico de un día típico.
# Rampa de 0 a 20 peticiones/s en 1 minuto y se mantiene 5 minutos.
# Pregunta que responde: ¿la aplicación aguanta el día a día con holgura?
schedule=rate(0/sec) random_arrivals(1 min) rate(20/sec) random_arrivals(5 min)

peso_eco=40
peso_consulta=35
peso_listado=15
peso_alta=10
max_id=100
