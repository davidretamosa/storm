# HUMO: comprobación rápida de que todo el laboratorio funciona.
# 2 peticiones/segundo durante 30 segundos.
schedule=rate(2/sec) random_arrivals(30 sec)

# Reparto del tráfico entre operaciones (pesos relativos, no hace falta que sumen 100)
peso_eco=40
peso_consulta=35
peso_listado=15
peso_alta=10

# Ids consultados en GET /api/items/{id}. Existen del 1 al 100;
# un valor mayor (p. ej. 110) provoca 404 a propósito para ver errores.
max_id=100
