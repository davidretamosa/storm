# Grafana con datasources, dashboard y proxy interno creados desde ficheros por desplegar.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: lab-jmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_INSTALL_PLUGINS
              value: cloudspout-button-panel
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
        - name: proxy
          image: nginx:stable-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: proxy-config
          configMap:
            name: grafana-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: lab-jmeter
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 8080
      nodePort: 30000   # http://localhost:30000 (admin / admin)
