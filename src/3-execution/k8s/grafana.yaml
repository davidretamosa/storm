# Grafana con datasources y dashboard creados desde ficheros.
# Los ConfigMaps grafana-datasources y grafana-dashboards los crea desplegar.sh:
# los datasources se reutilizan de lab-jmeter y el dashboard es grafana/lab-jmeter-k8s.json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: lab-jmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: lab-jmeter
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000   # http://localhost:30000 (admin / admin)
