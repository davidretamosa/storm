# Prometheus: CPU y memoria de cada pod.
# No hace falta desplegar cAdvisor: el kubelet de cada nodo ya lo lleva dentro y
# Prometheus lo lee a través de la API de Kubernetes (por eso necesita permisos).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: lab-jmeter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-jmeter-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-jmeter-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-jmeter-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: lab-jmeter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab-jmeter
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # cAdvisor del kubelet de cada nodo, leído a través de la API de Kubernetes
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lab-jmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # Prometheus no se ejecuta como root: se da su usuario (65534) al disco persistente
      initContainers:
        - name: permisos
          image: busybox:1.36
          command: ["chown", "-R", "65534:65534", "/prometheus"]
          volumeMounts:
            - name: datos
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: datos
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: datos
          persistentVolumeClaim:
            claimName: prometheus-datos
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lab-jmeter
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090   # http://localhost:30090
