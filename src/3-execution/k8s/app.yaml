# Aplicación bajo prueba. La imagen lab-app se construye en local
# (ver desplegar.sh), por eso imagePullPolicy: Never.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: lab-jmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: lab-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          # Margen amplio: bajo carga la app tarda en responder y no debe salir
          # del Service por estar ocupada (con 1 s de timeout pasaba y causaba
          # errores "Connection refused" en las pruebas). Solo se saca si no
          # responde durante un minuto seguido.
          readinessProbe:
            httpGet:
              path: /hello
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
---
# Nombre fijo "app" para que JMeter la encuentre (plan.jmx apunta a app:8080)
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: lab-jmeter
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # http://localhost:30080/hello
