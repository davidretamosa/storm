# Una prueba de carga = un Job: arranca, ejecuta plan.jmx y termina.
# El plan y los escenarios llegan desde ConfigMaps (los crea desplegar.sh):
# jmeter-plan (app de prueba) o jmeter-plan-bankapp, y jmeter-escenarios.
# Para lanzarla: ./lanzar-prueba.sh <escenario> [app|bankapp]
# (el script sustituye los marcadores __ESCENARIO__, __PLAN__, __HOST__ y los criterios).
# Al terminar, ejecutar-y-evaluar.sh comprueba los criterios de aprobado (criterios/):
# si no se cumplen, el Job termina en estado Failed.
apiVersion: batch/v1
kind: Job
metadata:
  name: jmeter
  namespace: lab-jmeter
spec:
  backoffLimit: 0                 # si falla, no se repite sola
  ttlSecondsAfterFinished: 3600   # se borra sola una hora después
  template:
    metadata:
      labels:
        app: jmeter
    spec:
      restartPolicy: Never
      containers:
        - name: jmeter
          image: lab-jmeter:latest
          imagePullPolicy: Never
          command: ["sh", "/scripts/ejecutar-y-evaluar.sh"]
          env:
            - name: MAX_ERRORES_PCT
              value: "__MAX_ERRORES_PCT__"
            - name: MAX_P95_MS
              value: "__MAX_P95_MS__"
          # Argumentos de jmeter. /test es de solo lectura (ConfigMap): el log va a /resultados.
          # El .jtl solo guarda columnas sin texto libre, para poder leerlo como CSV simple.
          args: ["-n", "-t", "/test/plan.jmx",
                 "-q", "/escenarios/__ESCENARIO__.properties", "-Jescenario=__ESCENARIO__", "-Jhost=__HOST__",
                 "-l", "/resultados/resultados.jtl", "-j", "/resultados/jmeter.log", "-f",
                 "-Jjmeter.save.saveservice.response_message=false",
                 "-Jjmeter.save.saveservice.failure_message=false",
                 "-Jjmeter.save.saveservice.thread_name=false",
                 "-Jjmeter.save.saveservice.url=false"]
          volumeMounts:
            - name: plan
              mountPath: /test
            - name: escenarios
              mountPath: /escenarios
            - name: scripts
              mountPath: /scripts
            - name: resultados
              mountPath: /resultados
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: plan
          configMap:
            name: __PLAN__
        - name: escenarios
          configMap:
            name: jmeter-escenarios
        - name: scripts
          configMap:
            name: jmeter-scripts
        - name: resultados
          emptyDir: {}
