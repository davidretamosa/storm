# Discos persistentes del laboratorio: sobreviven a reinicios de pods y de Docker.
# Se borran solo con ./quitar.sh (al borrar el namespace).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-datos
  namespace: lab-jmeter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-datos
  namespace: lab-jmeter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# Resultados de cada prueba (informe HTML, .jtl, log y veredicto): los escribe el Job
# de JMeter y lanzar-prueba.sh los copia al equipo en k8s/resultados/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jmeter-resultados
  namespace: lab-jmeter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# Pod auxiliar con el disco de resultados montado: kubectl cp no puede leer de un pod
# ya terminado (el de JMeter), así que la copia se hace desde aquí.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resultados
  namespace: lab-jmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resultados
  template:
    metadata:
      labels:
        app: resultados
    spec:
      containers:
        - name: resultados
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: resultados
              mountPath: /resultados
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: resultados
          persistentVolumeClaim:
            claimName: jmeter-resultados
