# La bankapp (aplicación objetivo del proyecto) en el clúster.
# La imagen se construye en local con ../bankapp/construir-imagen.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp
  namespace: lab-jmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankapp
  template:
    metadata:
      labels:
        app: bankapp
    spec:
      containers:
        - name: bankapp
          image: bankapp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          # Spring Boot ya trae un endpoint de salud para esto (Actuator).
          # Mismo margen amplio que app.yaml, para que la carga no la saque del Service.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bankapp
  namespace: lab-jmeter
spec:
  type: NodePort
  selector:
    app: bankapp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081   # http://localhost:30081/api/accounts
