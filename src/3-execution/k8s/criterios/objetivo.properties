# Criterios de aprobado de la app objetivo (./lanzar-prueba.sh <escenario> storm).
# Son los valores por defecto para cualquier app; ajústalos a lo que se exija a la que se prueba
# (cambia los números y vuelve a lanzar la prueba, no hace falta redesplegar).
# Los actuales vienen de la bankapp: una app bancaria no debería tener errores propios en más de
# 1 de cada 1.000 operaciones (0,1 %) y el 95 % de las respuestas debería llegar en menos de
# medio segundo.
# MAX_ERRORES_PCT: errores del servidor (5xx o sin respuesta); los rechazos 4xx no cuentan
MAX_ERRORES_PCT=0.1
MAX_P95_MS=500
