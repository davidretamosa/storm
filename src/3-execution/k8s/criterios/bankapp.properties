# Criterios de aprobado para la bankapp.
# Una app bancaria no debería tener errores propios en más de 1 de cada 1.000 operaciones (0,1 %)
# y el 95 % de las respuestas debería llegar en menos de medio segundo.
# MAX_ERRORES_PCT: errores del servidor (5xx o sin respuesta); los rechazos 4xx no cuentan
MAX_ERRORES_PCT=0.1
MAX_P95_MS=500
