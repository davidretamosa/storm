# Simulador de clientes (../simulador/simulador.py): usa la bankapp como lo harían personas,
# para que su sistema de logs registre "uso real". Lo lanza ./simular-clientes.sh, que
# sustituye __CLIENTES__ y __MINUTOS__. El script llega en el ConfigMap "simulador".
apiVersion: batch/v1
kind: Job
metadata:
  name: simulador
  namespace: lab-jmeter
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: simulador
    spec:
      restartPolicy: Never
      containers:
        - name: simulador
          image: python:3.12-slim
          command: ["python", "-u", "/simulador/simulador.py"]
          env:
            - name: BANKAPP
              value: "http://bankapp:8080"
            - name: CLIENTES
              value: "__CLIENTES__"
            - name: MINUTOS
              value: "__MINUTOS__"
          volumeMounts:
            - name: simulador
              mountPath: /simulador
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: simulador
          configMap:
            name: simulador
