# ESTRÉS: escalones crecientes hasta encontrar el límite.
# 25 -> 50 -> 100 -> 200 -> 400 pet/s, 2 minutos por escalón (unos 11 minutos).
# Pregunta que responde: ¿a partir de qué carga se dispara el p95 o aparecen errores?
# En el dashboard, el escalón donde eso ocurre es la capacidad máxima.
schedule=rate(25/sec) random_arrivals(2 min) rate(25/sec) random_arrivals(10 sec) rate(50/sec) random_arrivals(2 min) rate(50/sec) random_arrivals(10 sec) rate(100/sec) random_arrivals(2 min) rate(100/sec) random_arrivals(10 sec) rate(200/sec) random_arrivals(2 min) rate(200/sec) random_arrivals(10 sec) rate(400/sec) random_arrivals(2 min)

peso_eco=40
peso_consulta=35
peso_listado=15
peso_alta=10
max_id=100

# Con carga muy alta conviene cortar antes las peticiones colgadas
timeout_ms=5000
