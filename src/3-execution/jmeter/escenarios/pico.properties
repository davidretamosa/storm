# PICO: subida brusca de tráfico y vuelta a la normalidad.
#   2 min a 20 pet/s -> en 15 s sube a 150 pet/s -> 1 min a 150 pet/s
#   -> en 15 s baja a 20 pet/s -> 2 min a 20 pet/s
# Pregunta que responde: ¿soporta el pico y se recupera después?
schedule=rate(20/sec) random_arrivals(2 min) rate(20/sec) random_arrivals(15 sec) rate(150/sec) random_arrivals(1 min) rate(150/sec) random_arrivals(15 sec) rate(20/sec) random_arrivals(2 min)

peso_eco=40
peso_consulta=35
peso_listado=15
peso_alta=10
max_id=100
